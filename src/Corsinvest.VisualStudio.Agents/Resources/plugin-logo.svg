<!--
  The mascot's vector source. Fitted to plugin-logo.png by least squares (silhouette from the alpha channel,
  each gradient from the colours under it), on the PNG's own 500x500 grid: within 4 levels out of 255 (RMS)
  of it at that size. Themes/Icons.xaml is this drawing in XAML, layer for layer and number for number, so
  a change here is a change there. Not packaged: nothing loads it at run time.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- The lit surface, top to bottom. -->
    <linearGradient id="lit" gradientUnits="userSpaceOnUse" x1="11.5" y1="108.9" x2="47.3" y2="449.9">
      <stop offset="0" stop-color="#F898D6" />
      <stop offset="0.2" stop-color="#E05EF2" />
      <stop offset="0.4" stop-color="#BD58EF" />
      <stop offset="0.6" stop-color="#934DEE" />
      <stop offset="0.8" stop-color="#7049EA" />
      <stop offset="1" stop-color="#604BE0" />
    </linearGradient>
    <!-- The left arm and the body under the fold, lit from the top-left where the rest is lit from above. -->
    <linearGradient id="lower" gradientUnits="userSpaceOnUse" x1="312.3" y1="429.9" x2="113.6" y2="156.4">
      <stop offset="0" stop-color="#654AE4" />
      <stop offset="0.2" stop-color="#7E48EC" />
      <stop offset="0.4" stop-color="#9047ED" />
      <stop offset="0.6" stop-color="#9544ED" />
      <stop offset="0.8" stop-color="#B34FF0" />
      <stop offset="1" stop-color="#F479E8" />
    </linearGradient>
    <!-- The dark fold beside the left eye. -->
    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="-3.5" y1="98.9" x2="-7.8" y2="224.5">
      <stop offset="0" stop-color="#5828A2" />
      <stop offset="0.2" stop-color="#5523AD" />
      <stop offset="0.4" stop-color="#682EBF" />
      <stop offset="0.6" stop-color="#6F32C8" />
      <stop offset="0.8" stop-color="#7A37D3" />
      <stop offset="1" stop-color="#813AD9" />
    </linearGradient>
    <!-- The fold's band below the eye: darkest along its upper edge (this gradient, across the band), and
         dissolving down its length (the mask, along it). -->
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="-81.5" y1="81.5" x2="-35.5" y2="35.5">
      <stop offset="0" stop-color="#853CE2" />
      <stop offset="0.2" stop-color="#7F3CDE" />
      <stop offset="0.4" stop-color="#763BD9" />
      <stop offset="0.6" stop-color="#6D38D2" />
      <stop offset="0.8" stop-color="#5E33C5" />
      <stop offset="1" stop-color="#5C31BB" />
    </linearGradient>
    <linearGradient id="band-fade" gradientUnits="userSpaceOnUse" x1="147" y1="147" x2="320" y2="320">
      <stop offset="0" stop-color="#FFF" stop-opacity="1" />
      <stop offset="0.25" stop-color="#FFF" stop-opacity="0.847" />
      <stop offset="0.5" stop-color="#FFF" stop-opacity="0.565" />
      <stop offset="0.75" stop-color="#FFF" stop-opacity="0.329" />
      <stop offset="1" stop-color="#FFF" stop-opacity="0.008" />
    </linearGradient>
    <!-- The crease from the right eye to the arm: a shadow over whatever is under it, so alpha only. -->
    <linearGradient id="crease" gradientUnits="userSpaceOnUse" x1="-14.9" y1="11.6" x2="129.6" y2="-101.2">
      <stop offset="0" stop-color="#280F8C" stop-opacity="0" />
      <stop offset="0.6" stop-color="#280F8C" stop-opacity="0.016" />
      <stop offset="0.8" stop-color="#280F8C" stop-opacity="0.075" />
      <stop offset="1" stop-color="#280F8C" stop-opacity="0.329" />
    </linearGradient>
    <mask id="band-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="500">
      <rect width="500" height="500" fill="url(#band-fade)" />
    </mask>
    <!-- Body (round top corners, tighter bottom ones), the arms as one bar through it, four legs. The eyes
         wind the other way, which is what cuts them out. -->
    <clipPath id="silhouette">
      <path d="M 85.5,100 H 418.25 A 19.5,19.5 0 0 1 437.75,119.5 V 341.5 A 13,13 0 0 1 424.75,354.5 H 76 A 13,13 0 0 1 63,341.5 V 122.5 A 22.5,22.5 0 0 1 85.5,100 Z
               M 17.25,228.25 H 482.5 A 11,11 0 0 1 493.5,239.25 V 281 A 11,11 0 0 1 482.5,292 H 17.25 A 11,11 0 0 1 6.25,281 V 239.25 A 11,11 0 0 1 17.25,228.25 Z
               M 94.75,340 H 126 V 406 A 9.5,9.5 0 0 1 116.5,415.5 H 104.25 A 9.5,9.5 0 0 1 94.75,406 Z
               M 157.25,340 H 189 V 406 A 9.5,9.5 0 0 1 179.5,415.5 H 166.75 A 9.5,9.5 0 0 1 157.25,406 Z
               M 311.25,340 H 343 V 406 A 9.5,9.5 0 0 1 333.5,415.5 H 320.75 A 9.5,9.5 0 0 1 311.25,406 Z
               M 373.75,340 H 405 V 406 A 9.5,9.5 0 0 1 395.5,415.5 H 383.25 A 9.5,9.5 0 0 1 373.75,406 Z
               M 126,167 V 228 H 157 V 167 Z
               M 343,167 V 228 H 374 V 167 Z" />
    </clipPath>
  </defs>
  <!-- The shading layers are plain polygons running past the edge: the clip is what shapes them. -->
  <g clip-path="url(#silhouette)">
    <rect width="500" height="500" fill="url(#lit)" />
    <path d="M 0,228 H 157 L 429,500 H 0 Z" fill="url(#lower)" />
    <g mask="url(#band-mask)">
      <path d="M 65,228 H 157 L 429,500 H 337 Z" fill="url(#band)" />
    </g>
    <path d="M 0,100 H 76 Q 84,101 93.5,111 L 149.5,167 H 126 V 228 H 0 Z" fill="url(#fold)" />
    <path d="M 250,228 H 374 L 500,354 V 500 H 250 Z" fill="url(#crease)" />
  </g>
</svg>
